<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#0a0e11"/><stop offset="1" stop-color="#121915"/></linearGradient>
  </defs>
  <rect width="1200" height="600" rx="24" fill="url(#bg)"/>
  <text x="58" y="68" fill="#f3f6f4" font-family="Segoe UI,Arial" font-size="30" font-weight="700">Detection Surface — Correlating Injection Telemetry</text>
  <text x="58" y="101" fill="#8fa299" font-family="Segoe UI,Arial" font-size="16">Defensive interpretation of the PoC's behavior chain</text>

  <g font-family="Segoe UI,Arial">
    <rect x="72" y="160" width="260" height="118" rx="16" fill="#151d19" stroke="#39ff88" stroke-width="2"/>
    <text x="202" y="200" text-anchor="middle" fill="#39ff88" font-size="18" font-weight="700">Process Access</text>
    <text x="202" y="231" text-anchor="middle" fill="#d7e2dc" font-size="14">Handle opened to another PID</text>
    <text x="202" y="255" text-anchor="middle" fill="#81928a" font-size="13">Context: source PID → target PID</text>

    <rect x="470" y="160" width="260" height="118" rx="16" fill="#151d19" stroke="#39ff88" stroke-width="2"/>
    <text x="600" y="200" text-anchor="middle" fill="#39ff88" font-size="18" font-weight="700">Remote Memory</text>
    <text x="600" y="231" text-anchor="middle" fill="#d7e2dc" font-size="14">Allocation + cross-process write</text>
    <text x="600" y="255" text-anchor="middle" fill="#81928a" font-size="13">High-signal when chained in time</text>

    <rect x="868" y="160" width="260" height="118" rx="16" fill="#151d19" stroke="#39ff88" stroke-width="2"/>
    <text x="998" y="200" text-anchor="middle" fill="#39ff88" font-size="18" font-weight="700">Remote Execution</text>
    <text x="998" y="231" text-anchor="middle" fill="#d7e2dc" font-size="14">Thread starts in target process</text>
    <text x="998" y="255" text-anchor="middle" fill="#81928a" font-size="13">Start address deserves context</text>

    <path d="M332 219 H470" stroke="#39ff88" stroke-width="3"/><path d="M730 219 H868" stroke="#39ff88" stroke-width="3"/>
    <path d="M460 213 l12 6 -12 6z" fill="#39ff88"/><path d="M858 213 l12 6 -12 6z" fill="#39ff88"/>

    <rect x="188" y="350" width="824" height="154" rx="18" fill="#0f1512" stroke="#2b3b33"/>
    <text x="600" y="392" text-anchor="middle" fill="#f0f5f2" font-size="19" font-weight="700">Correlated finding</text>
    <text x="600" y="425" text-anchor="middle" fill="#b4c3bb" font-size="15">same source process + same target PID + short time window</text>
    <text x="600" y="453" text-anchor="middle" fill="#b4c3bb" font-size="15">remote allocation → memory write → remote thread</text>
    <text x="600" y="483" text-anchor="middle" fill="#71847a" font-size="13">Treat as triage evidence, not a malware verdict. Legitimate debuggers, EDRs and accessibility tools can use similar primitives.</text>
  </g>
</svg>